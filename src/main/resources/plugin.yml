name: MoreFeatures
version: 1.0.0
main: net.gravijet.morefeatures.Main
# Sync registers /link and /unlink at runtime, not in its plugin.yml, so the only
# way to take them is to enable after it has and rewrite the command map.
softdepend: [Sync, Phoenix, PlaceholderAPI, MBedwars]
author: gravijet
description: More features for example.invalid

commands:
  bridgesync:
    description: Forces an immediate Bridge sync
    permission: bridge.sync
    usage: /bridgesync
  fullbright:
    description: Toggle fullbright server-wide or for a single player
    permission: morefeatures.fullbright
    usage: /fullbright [on|off|toggle|status] or /fullbright <player> [on|off|toggle]
  link:
    description: Link your Minecraft account to Discord via example.invalid
    permission: morefeatures.link
    usage: /link <code>
  unlink:
    description: Unlink your Minecraft account from Discord
    permission: morefeatures.link
    usage: /unlink

permissions:
  bridge.sync:
    description: Allows running /bridgesync
    default: op
  morefeatures.fullbright:
    description: Toggle server-wide fullbright via /fullbright
    default: op
  morefeatures.fullbright.others:
    description: Toggle fullbright for another player
    default: op
  morefeatures.autoplace.bypass:
    description: Bypass AutoPlace detection entirely
    default: op
  morefeatures.autoplace.alerts:
    description: Receive staff alerts when a player is flagged for AutoPlace
    default: op
  morefeatures.link:
    description: Use /link and /unlink
    default: true
  morefeatures.chat.color:
    description: Use &-colour codes in your own chat messages
    default: op
