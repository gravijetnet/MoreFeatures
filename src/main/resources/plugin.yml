name: MoreFeatures
version: 1.0.0
main: net.gravijet.morefeatures.Main
# Sync registers /link and /unlink at runtime, not in its plugin.yml, so the only
# way to take them is to enable after it has and rewrite the command map.
softdepend: [Sync, Phoenix]
author: gravijet
description: More features for example.invalid

commands:
  bridgesync:
    description: Forces an immediate Bridge sync
    permission: bridge.sync
    usage: /bridgesync
  music:
    description: Main music control hub
    aliases: [m]
    usage: /music <play|stop|force|list|download|info>
  rickroll:
    description: Rickroll yourself or another player
    permission: morefeatures.rickroll
    usage: /rickroll [player] <time>
  fullbright:
    description: Toggle server-wide fullbright (max chunk lighting)
    permission: morefeatures.fullbright
    usage: /fullbright [on|off|toggle|status]
  link:
    description: Link your Minecraft account to Discord via example.invalid
    permission: morefeatures.link
    usage: /link <code>
  unlink:
    description: Unlink your Minecraft account from Discord
    permission: morefeatures.link
    usage: /unlink

permissions:
  bridge.sync:
    description: Allows running /bridgesync
    default: op
  morefeatures.music.play:
    description: Play music for yourself
    default: true
  morefeatures.music.stop:
    description: Stop your own music
    default: true
  morefeatures.music.list:
    description: List available songs
    default: true
  morefeatures.music.info:
    description: Show currently playing song info
    default: true
  morefeatures.music.volume:
    description: Change default playback volume
    default: true
  morefeatures.music.force:
    description: Force play music for other players
    default: op
  morefeatures.music.download:
    description: Manually trigger song download
    default: op
  morefeatures.rickroll:
    description: Rickroll yourself
    default: true
  morefeatures.rickroll.others:
    description: Rickroll other players
    default: op
  morefeatures.fullbright:
    description: Toggle server-wide fullbright via /fullbright
    default: op
  morefeatures.autoplace.bypass:
    description: Bypass AutoPlace detection entirely
    default: op
  morefeatures.autoplace.alerts:
    description: Receive staff alerts when a player is flagged for AutoPlace
    default: op
  morefeatures.link:
    description: Use /link and /unlink
    default: true
