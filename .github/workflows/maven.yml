name: Build and Permanent Release MoreFeatures

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 (for BuildTools)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Run BuildTools
        run: |
          mkdir buildtools && cd buildtools
          wget -q https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8
          
          # BuildTools installiert automatisch alle Abhängigkeiten (inkl. bungeecord-chat) nach ~/.m2/repository.
          # Das manuelle 'mvn install:install-file' wurde entfernt, da es zu einem Abbruch führt.
          echo "BuildTools erfolgreich abgeschlossen. Abhängigkeiten sind im lokalen Maven-Repo vorhanden."

      - name: Set up JDK 21 (for Plugin Compilation)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Prepare Artifacts
        run: |
          JAR_PATH=$(find target/ -name "MoreFeatures-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
          cp "$JAR_PATH" ./morefeatures-build-${{ github.run_number }}.jar
          cp "$JAR_PATH" ./morefeatures-latest.jar

      - name: Create Archive Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MoreFeatures Build #${{ github.run_number }}"
          body: "Archive of Build #${{ github.run_number }}."
          files: morefeatures-build-${{ github.run_number }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MoreFeatures Latest Build"
          make_latest: true
          files: morefeatures-latest.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
